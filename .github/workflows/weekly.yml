name: Aggiornamento settimanale

on:
  schedule:
    - cron: "17 5 * * 6"      # ogni sabato alle 05:17 UTC (mercati chiusi)
  push:                       # riparte da solo quando cambiano codice o criteri su main
    branches: [main]
    paths: ["screener/**", "config/**", "requirements.txt", ".github/workflows/weekly.yml"]
  workflow_dispatch:          # avvio manuale dal tab Actions
    inputs:
      limit:
        description: "Numero massimo di titoli (vuoto = tutti)"
        required: false

permissions:
  contents: write

concurrency:
  group: weekly-screening
  cancel-in-progress: false

jobs:
  screening:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: Screening
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          FINVIZ_AUTH: ${{ secrets.FINVIZ_AUTH }}
        run: |
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            python -m screener.run --limit "${{ github.event.inputs.limit }}"
          else
            python -m screener.run
          fi
      - name: Salva i risultati nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Se nel frattempo main è cambiato (es. un altro aggiornamento), si riparte dalla versione
          # più recente e si salvano sopra solo i dati appena calcolati (data/ e docs/).
          for i in 1 2 3 4; do
            git fetch origin main
            git reset --mixed origin/main
            git add data docs
            git diff --cached --quiet && exit 0
            git commit -m "Aggiornamento settimanale $(date -u +%Y-%m-%d)"
            git push origin HEAD:main && exit 0
            sleep $((2**i))
          done
          exit 1
