name: Prova con dati reali (solo rami di sviluppo)

# Parte quando si salva codice su un ramo claude/*: esegue lo screening su un
# campione di titoli e stampa un riepilogo nel registro. Non salva nulla su main.
on:
  push:
    branches: ["claude/**"]

jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: Prova notizie
        run: python -c "import yfinance as yf; from screener.sources.yahoo import fetch_news; n=fetch_news(yf.Ticker('AAPL')); print(len(n), n[:2])"
      - name: Screening su un campione
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python -m screener.run --tickers NVDA,AAPL,KO,MC.PA,2330.TW,ANT
      - name: Riepilogo
        run: python -m screener.summary
      - name: Prova ricerca per nome
        run: |
          python -m screener.analizza preview --request-id prova --payload "Anthropic|Anthropic PBC"
          python -c "import json; d=json.load(open('previews/prova.json')); [print(r['query'], '->', r.get('symbol'), r['status'], (r.get('record') or {}).get('name'), [c['symbol'] for c in r['candidates']]) for r in d['results']]"
