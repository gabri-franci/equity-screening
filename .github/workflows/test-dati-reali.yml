name: Prova con dati reali (solo rami di sviluppo)

# Parte quando si salva codice su un ramo claude/*: esegue lo screening su un
# campione di titoli e stampa un riepilogo nel registro. Non salva nulla su main.
on:
  push:
    branches: ["claude/**"]

jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: Prova notizie
        run: python -c "import yfinance as yf; from screener.sources.yahoo import fetch_news; n=fetch_news(yf.Ticker('AAPL')); print(len(n), n[:2])"
      - name: Screening su un campione
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python -m screener.run --tickers AAPL,MSFT,GOOGL,AMZN,NVDA,JPM,BRK-B,V,ALL,PFE,ISRG,XOM,O,AMT,T,CAT,PG,NEE,LIN,TSLA
      - name: Riepilogo
        run: python -m screener.summary
