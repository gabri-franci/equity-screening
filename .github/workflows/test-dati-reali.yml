name: Prova con dati reali (solo rami di sviluppo)

# Parte quando si salva codice su un ramo claude/*: esegue lo screening su un
# campione di titoli e stampa un riepilogo nel registro. Non salva nulla su main.
on:
  push:
    branches: ["claude/**"]

jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: Diagnostica notizie
        run: |
          python - <<'PY'
          import yfinance as yf, json
          print("yfinance", yf.__version__)
          t = yf.Ticker("AAPL")
          for name, fn in (("get_news", lambda: t.get_news(count=5)), ("news", lambda: t.news), ("Search", lambda: yf.Search("AAPL", news_count=5).news)):
              try:
                  r = fn()
                  print(name, type(r).__name__, len(r) if r is not None else None)
                  print(json.dumps(r[:1] if r else r, default=str)[:1500])
              except Exception as e:
                  print(name, "ERRORE", repr(e)[:500])
          PY
      - name: Screening su un campione
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python -m screener.run --tickers AAPL,MSFT,GOOGL,AMZN,NVDA,JPM,BRK-B,V,ALL,PFE,ISRG,XOM,O,AMT,T,CAT,PG,NEE,LIN,TSLA
      - name: Riepilogo
        run: python -m screener.summary
